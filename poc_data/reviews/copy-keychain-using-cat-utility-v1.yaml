    rationale: "This overlay meets all quality criteria for approval:\n\n1. **Material Security\
      \ Effect**: The command produces a material security-relevant effect\u2014it copies\
      \ the macOS login keychain database (containing passwords, certificates, private keys,\
      \ and tokens) to a world-readable temporary location. This is credential staging, a\
      \ recognized attack step in T1555.001 (Credentials from Password Managers).\n\n2. **Command\
      \ Behavior Coherence**: The objective and required_effects accurately describe what\
      \ `cat ~/Library/Keychains/login.keychain-db > /tmp/keychain` does\u2014it reads and\
