      \ effect: it demonstrates process-name masquerading\u2014a genuine defense-evasion technique\
      \ where a shell binary is renamed to impersonate the legitimate cron daemon. This is\
      \ independent of the harmless payload ('sleep 5'); the masquerading mechanism itself\
      \ is the security concern, which the overlay correctly identifies in its invalid_relaxations\
      \ section.\n\nThe required_effects are precise and coherent: the copy creates a file\
      \ at a path mimicking the cron daemon, and execution causes it to appear as 'crond'\
